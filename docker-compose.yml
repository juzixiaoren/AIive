services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiive
      POSTGRES_PASSWORD: aiive_dev
      POSTGRES_DB: aiive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅发布到本机：容器内的 backend 走 compose 网络（postgres:5432），
      # 而本地开发（宿主机直接跑 uvicorn，.env 指向 localhost:5432）需要此映射
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiive -d aiive"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 可选的本地 Embedding 服务。仅在 scripts/start.sh 检测到
  # AIIVE_MEMORY_VECTOR_ENABLED=true + AIIVE_EMBEDDING_PROVIDER=local 时启用。
  # 首次启动自动下载模型，后续从宿主机 .data 缓存复用。
  embedding:
    image: "ghcr.io/huggingface/text-embeddings-inference:${AIIVE_TEI_IMAGE_TAG:-cpu-1.9}"
    profiles: ["local-embedding"]
    command:
      - "--model-id"
      - "${AIIVE_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}"
      - "--revision"
      - "${AIIVE_EMBEDDING_MODEL_REVISION:-534b6bfaaf500e70bcb9f3771cebc940c23b219d}"
      - "--served-model-name"
      - "${AIIVE_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}"
      - "--max-concurrent-requests"
      - "${AIIVE_LOCAL_EMBEDDING_MAX_CONCURRENCY:-32}"
    volumes:
      - ./.data/models/embeddings:/data
    ports:
      - "127.0.0.1:${AIIVE_LOCAL_EMBEDDING_PORT:-8081}:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 复用宿主机 .env 中的 LLM Key 等配置（不写进镜像）
    env_file: .env
    environment:
      # 覆盖 .env 中面向本机的默认值，指向容器网络
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://aiive:aiive_dev@postgres:5432/aiive"
      # 宿主机直连用 127.0.0.1:8081；容器内通过 Compose 服务名访问。
      AIIVE_EMBEDDING_BASE_URL: "${AIIVE_DOCKER_EMBEDDING_BASE_URL:-${AIIVE_EMBEDDING_BASE_URL:-http://embedding:80/v1}}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aiive_data:/app/.data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # 仅暴露到本机，由服务器 nginx(443) 反代 /aiive 对外提供服务
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  aiive_data:
