services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiive
      POSTGRES_PASSWORD: aiive_dev
      POSTGRES_DB: aiive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 仅发布到本机：容器内的 backend 走 compose 网络（postgres:5432），
      # 而本地开发（宿主机直接跑 uvicorn，.env 指向 localhost:5432）需要此映射
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiive -d aiive"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 复用宿主机 .env 中的 LLM Key 等配置（不写进镜像）
    env_file: .env
    environment:
      # 覆盖 .env 中面向本机的默认值，指向容器网络
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://aiive:aiive_dev@postgres:5432/aiive"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aiive_data:/app/.data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # 仅暴露到本机，由服务器 nginx(443) 反代 /aiive 对外提供服务
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  aiive_data:
