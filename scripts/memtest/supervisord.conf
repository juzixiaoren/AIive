; 三个常驻进程共享同一容器 cgroup，由 docker --memory 统一约束。
[supervisord]
nodaemon=true
loglevel=info
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.log

[program:embedding]
command=/usr/local/bin/text-embeddings-router
    --model-id %(ENV_EMB_MODEL)s
    --revision %(ENV_EMB_REVISION)s
    --served-model-name %(ENV_EMB_MODEL)s
    --port 8081
    --max-concurrent-requests %(ENV_TEI_MAX_CONCURRENCY)s
    --max-batch-tokens %(ENV_TEI_MAX_BATCH_TOKENS)s
    --auto-truncate
environment=HF_HOME="/data",HUGGINGFACE_HUB_CACHE="/data"
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/embedding.log
stderr_logfile=/var/log/embedding.log

[program:backend]
command=/bin/sh -c "/app/scripts/memtest/start_backend.sh"
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.log
