name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: 单元测试（pytest）
    runs-on: ubuntu-latest
    # 单元测试不依赖外部数据库：用 SQLite 文件库兜底，避免连接不存在的 PostgreSQL。
    env:
      DATABASE_URL: sqlite:///./ci_unit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行单元测试
        run: pytest tests/unit -v

  basedpyright:
    name: 类型检查（basedpyright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 basedpyright
        run: pip install basedpyright
      - name: 运行 basedpyright
        run: basedpyright

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: npm install
      - name: 构建
        run: npm run build

  alembic:
    name: Alembic 空库升级
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiive
          POSTGRES_PASSWORD: aiive_dev
          POSTGRES_DB: aiive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiive -d aiive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # alembic env.py 从 settings.database_url 读取，环境变量优先于 alembic.ini。
      DATABASE_URL: postgresql+psycopg://aiive:aiive_dev@localhost:5432/aiive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 在空库上执行迁移至 head
        run: alembic upgrade head

  integration:
    name: PostgreSQL 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiive
          POSTGRES_PASSWORD: aiive_dev
          POSTGRES_DB: aiive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiive -d aiive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://aiive:aiive_dev@localhost:5432/aiive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行集成测试
        # 集成测试统一置于 tests/integration（当前为空，待补充）。
        # 用 collect-only 探测，避免空集合导致 pytest 以 exit code 5 失败。
        run: |
          if pytest tests/integration --collect-only -q | grep -q "::"; then
            pytest tests/integration -v
          else
            echo "tests/integration 暂无可收集测试，跳过"
          fi

  docker-smoke:
    name: Docker Compose 冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 .env
        run: cp .env.example .env
      - name: 构建镜像
        run: docker compose build
      - name: 启动服务栈
        run: docker compose up -d
      - name: 执行数据库迁移
        run: docker compose exec -T backend alembic upgrade head
      - name: 等待后端健康
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "backend 未就绪"; docker compose logs --tail=100 backend; exit 1
      - name: 检查前端
        run: curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: 关停
        if: always()
        run: docker compose down -v
