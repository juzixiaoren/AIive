name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: 单元与关键流程测试（pytest）
    runs-on: ubuntu-latest
    # 单元与流程测试不依赖外部数据库：conftest 统一使用 SQLite 文件库兜底，
    # 避免连接不存在的 PostgreSQL；也不需要任何外部 API Key。
    env:
      DATABASE_URL: sqlite:///./ci_unit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行单元与关键流程测试
        run: pytest tests/unit tests/flow -v

  single-file:
    name: 单文件隔离运行（顺序依赖防线）
    runs-on: ubuntu-latest
    env:
      # 每个测试文件单独进程；根 conftest 用 PID 命名 SQLite 库，进程间互不干扰。
      PYTHON_BIN: python
      JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 逐文件单独运行
        run: bash scripts/check_single_file_tests.sh

  ruff:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        # 与本地基线（docs/CODE_MAP.md §10.5）同版本，避免上游规则变更导致门禁漂移
        run: pip install ruff==0.17.1
      - name: 运行 ruff
        # 只启用真实缺陷规则（未定义名、语法错误）；风格项不作为门禁，
        # 与本地基线 docs/CODE_MAP.md §10.5 保持一致。
        run: ruff check backend/aiive --select F,E9

  basedpyright:
    name: 类型检查（basedpyright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        # basedpyright 需要能解析第三方包（sqlalchemy/fastapi/mcp 等），
        # 否则 reportMissingImports 会把缺失依赖报成 error，并连带触发
        # reportImplicitRelativeImport（第一轮该 job 一直失败的真因）。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 安装 basedpyright
        run: pip install basedpyright==1.40.2
      - name: 运行 basedpyright
        run: basedpyright

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: npm install
      - name: 构建
        run: npm run build

  alembic:
    name: Alembic 空库升级
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiive
          POSTGRES_PASSWORD: aiive_dev
          POSTGRES_DB: aiive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiive -d aiive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # alembic env.py 从 settings.database_url 读取，环境变量优先于 alembic.ini。
      DATABASE_URL: postgresql+psycopg://aiive:aiive_dev@localhost:5432/aiive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 在空库上执行迁移至 head
        run: alembic upgrade head

  integration:
    name: 本地集成测试（pytest）
    runs-on: ubuntu-latest
    # 本地集成测试全部离线：conftest 统一使用进程级 SQLite 文件库，
    # 不连接 PostgreSQL，也不需要任何外部 API Key。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行本地集成测试
        # 集成测试位于 tests/integration（SQLite 离线）。
        # 用 collect-only 探测，避免空集合导致 pytest 以 exit code 5 失败。
        run: |
          if pytest tests/integration --collect-only -q | grep -q "::"; then
            pytest tests/integration -v
          else
            echo "tests/integration 暂无可收集测试，跳过"
          fi

  docker-smoke:
    name: Docker Compose 冒烟测试
    runs-on: ubuntu-latest
    env:
      # 境外 runner 用官方源构建镜像；默认值（国内镜像）留给本地与国内服务器。
      AIIVE_APT_MIRROR: deb.debian.org
      AIIVE_PIP_INDEX_URL: https://pypi.org/simple
      AIIVE_NPM_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - name: 准备 .env
        run: cp .env.example .env
      - name: 构建镜像
        run: docker compose build
      - name: 启动服务栈
        run: docker compose up -d
      - name: 等待后端健康
        # 应用 lifespan 启动时会自动执行 alembic upgrade head；必须先等它迁移完成，
        # 否则下面再并发跑一次迁移会撞车（duplicate table / pg_type_typname_nsp_index）。
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 3
          done
          echo "backend 未就绪"
          docker compose ps -a
          docker compose logs --tail=200 backend
          # 日志在无权限时不可见；把尾部日志写进 annotation（公开可读）便于定位
          echo "::error title=backend-startup::$(docker compose logs --tail=60 backend 2>&1 | tr '\n' ' ' | tr -s ' ' | cut -c1-3000)"
          exit 1
      - name: 确认迁移到 head
        # 幂等校验：应用已迁移完毕，这里只确认 alembic 版本与 head 一致。
        run: docker compose exec -T backend alembic upgrade head
      - name: 检查前端
        run: curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: 失败诊断
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200
      - name: 关停
        if: always()
        run: docker compose down -v
