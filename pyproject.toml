[project]
name = "aiive"
version = "0.1.0-alpha.1"
description = "AIive - Personal Agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph-prebuilt>=1.0",
    "json-repair>=0.30.0",
    "apscheduler>=3.10",
    "litellm>=1.50.0,<2.0.0",
    # FastMCP 1.x provides mcp.server.fastmcp used by the bundled stdio server.
    # MCP SDK 2.x removed that import path and requires a separate migration.
    "mcp>=1.0,<2.0",
    "pillow>=10.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"aiive.prompts" = ["manifest.toml", "**/*.md"]
"aiive.skills" = ["builtin/**/SKILL.md"]

[tool.basedpyright]
include = ["backend"]
exclude = ["backend/alembic/versions", "backend/alembic/_archive_migrations_20260717", "backend/tests", "backend/conftest.py"]
reportImportCycles = "none"
reportCallInDefaultInitializer = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportMissingTypeStubs = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUntypedFunctionDecorator = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnusedCallResult = "none"
reportMissingModuleSource = "none"
